<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرعون التاريخ | تسجيل الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e5;--surface:#fffaf0;--surface2:#efe4ce;--text:#241b12;--muted:#766856;--gold:#b68b3c;--brown:#4c3020;--border:rgba(76,48,32,.14);--shadow:0 20px 50px rgba(62,42,22,.12)}
[data-theme=dark]{--bg:#151311;--surface:#211d19;--surface2:#2b251f;--text:#f6eddb;--muted:#b8aa94;--gold:#d6ad5c;--brown:#e7d5b6;--border:rgba(255,231,187,.12);--shadow:0 20px 60px rgba(0,0,0,.3)}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Arial;background:var(--bg);color:var(--text);line-height:1.8}a{text-decoration:none;color:inherit}.container{width:min(1100px,92%);margin:auto}
header{border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:18px}.brand small{display:block;color:var(--gold);font-size:11px}.logo{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--gold);border-radius:50%;margin-left:8px;color:var(--gold)}
main{padding:45px 0}.hero{text-align:center;padding:30px 0 20px}.hero h1{font-family:"Playfair Display";font-size:clamp(38px,7vw,64px);margin:10px 0}.hero h1 span{color:var(--gold)}.hero p{color:var(--muted);max-width:700px;margin:auto}
.panel{max-width:620px;margin:30px auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit;font-weight:700;cursor:pointer}.tabs button.active{background:var(--gold);color:#20170e}
label{display:block;margin:12px 0 6px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}button.main{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--gold);color:#20170e;font:inherit;font-weight:800;cursor:pointer}.hint{color:var(--muted);font-size:13px;margin-top:8px}.msg{margin-top:14px;padding:10px;border-radius:9px;display:none}.error{display:block;background:#7b2424;color:#fff}.ok{display:block;background:#245d3c;color:#fff}
.dashboard{display:none}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.logout,.theme{padding:9px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text);font:inherit;cursor:pointer}.videos{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:25px}.video{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}.video h3{margin-top:0}.video a{color:var(--gold);font-weight:800}@media(max-width:650px){.videos{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container nav"><div class="brand"><span class="logo">𓂀</span>فرعون التاريخ<small>الأستاذ محمد عنتر</small></div><button class="theme" id="themeBtn">☾</button></div></header>

<main>
<div id="authArea">
<section class="hero"><div class="container"><h1>مملكة <span>فرعون التاريخ</span></h1><p>سجّل دخولك للوصول إلى فيديوهات الصف الدراسي الخاص بك.</p></div></section>
<div class="panel">
<div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="registerTab">إنشاء حساب طالب</button></div>
<form id="authForm">
<label>اسم المستخدم</label><input id="username" autocomplete="username" required minlength="3" maxlength="30" placeholder="مثال: ahmed_123">
<label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="6 أحرف أو أكثر">
<div id="gradeWrap" style="display:none"><label>الصف الدراسي</label><select id="grade"><option value="">اختر الصف</option><option>أولى إعدادي</option><option>ثانية إعدادي</option><option>ثالثة إعدادي</option><option>أولى ثانوي</option><option>ثانية ثانوي</option></select></div>
<button class="main" id="submitBtn">دخول</button><div class="hint">لا تحتاج إلى بريد إلكتروني. كلمة المرور تُدار بأمان بواسطة Firebase.</div><div id="msg" class="msg"></div>
</form>
</div>
</div>

<section id="dashboard" class="dashboard">
<div class="container">
<div class="topline"><div><h2>أهلاً يا <span id="dashUser"></span> 👋</h2><div class="hint">الصف: <strong id="dashGrade"></strong></div></div><button class="logout" id="logoutBtn">تسجيل الخروج</button></div>
<div class="videos" id="videos"></div>
</div>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCxbrSZFZn0n58VFx2p2q50e_j8FGjYQgU",
authDomain:"fr3on-eltari5.firebaseapp.com",
projectId:"fr3on-eltari5",
storageBucket:"fr3on-eltari5.firebasestorage.app",
messagingSenderId:"735338799204",
appId:"1:735338799204:web:e5a8c2c3509cb7091e7f71",
measurementId:"G-2X9SJ9W5ZJ"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const domain="@students.fr3on-eltari5.firebaseapp.com";
const grades=["أولى إعدادي","ثانية إعدادي","ثالثة إعدادي","أولى ثانوي","ثانية ثانوي"];
const videoData={
"أولى إعدادي":[["فيديوهات أولى إعدادي","https://www.youtube.com/","أضف رابط الفيديو الحقيقي هنا."]],
"ثانية إعدادي":[["فيديوهات ثانية إعدادي","https://www.youtube.com/","أضف رابط الفيديو الحقيقي هنا."]],
"ثالثة إعدادي":[["فيديوهات ثالثة إعدادي","https://www.youtube.com/","أضف رابط الفيديو الحقيقي هنا."]],
"أولى ثانوي":[["فيديوهات أولى ثانوي","https://www.youtube.com/","أضف رابط الفيديو الحقيقي هنا."]],
"ثانية ثانوي":[["فيديوهات ثانية ثانوي","https://www.youtube.com/","أضف رابط الفيديو الحقيقي هنا."]]
};
let mode="login";
const $=id=>document.getElementById(id), form=$("authForm"), msg=$("msg");
function emailFor(u){return u.trim().toLowerCase()+domain}
function validUser(u){return /^[a-zA-Z0-9_\u0600-\u06FF]{3,30}$/.test(u.trim())}
function showMsg(t,ok=false){msg.textContent=t;msg.className="msg "+(ok?"ok":"error")}
$("loginTab").onclick=()=>{mode="login";$("loginTab").classList.add("active");$("registerTab").classList.remove("active");$("gradeWrap").style.display="none";$("submitBtn").textContent="دخول";msg.className="msg"};
$("registerTab").onclick=()=>{mode="register";$("registerTab").classList.add("active");$("loginTab").classList.remove("active");$("gradeWrap").style.display="block";$("submitBtn").textContent="إنشاء الحساب";msg.className="msg"};
form.onsubmit=async e=>{
e.preventDefault();const u=$("username").value.trim(),p=$("password").value;
if(!validUser(u)) return showMsg("اسم المستخدم يجب أن يكون من 3 إلى 30 حرفًا أو رقمًا أو _.");
if(p.length<6) return showMsg("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
$("submitBtn").disabled=true;
try{
if(mode==="register"){
const g=$("grade").value;if(!grades.includes(g)) throw new Error("اختر الصف الدراسي.");
const cred=await createUserWithEmailAndPassword(auth,emailFor(u),p);
await setDoc(doc(db,"users",cred.user.uid),{username:u,grade:g,createdAt:serverTimestamp()});
showMsg("تم إنشاء الحساب بنجاح.",true);
}else await signInWithEmailAndPassword(auth,emailFor(u),p);
}catch(e){showMsg(e.code==="auth/email-already-in-use"?"اسم المستخدم مستخدم بالفعل.":e.code==="auth/invalid-credential"?"اسم المستخدم أو كلمة المرور غير صحيحة.":e.message)}
finally{$("submitBtn").disabled=false}
};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
if(!user){$("authArea").style.display="block";$("dashboard").style.display="none";return}
const snap=await getDoc(doc(db,"users",user.uid));
if(!snap.exists()){await signOut(auth);return}
const d=snap.data();$("dashUser").textContent=d.username;$("dashGrade").textContent=d.grade;
$("videos").innerHTML=(videoData[d.grade]||[]).map(v=>`<article class="video"><h3>${v[0]}</h3><p>${v[2]}</p><a href="${v[1]}" target="_blank" rel="noopener">مشاهدة الفيديو ←</a></article>`).join("");
$("authArea").style.display="none";$("dashboard").style.display="block";
});
const saved=localStorage.getItem("theme");if(saved==="dark")document.documentElement.setAttribute("data-theme","dark");
$("themeBtn").onclick=()=>{const dark=document.documentElement.getAttribute("data-theme")==="dark";if(dark){document.documentElement.removeAttribute("data-theme");localStorage.setItem("theme","light");$("themeBtn").textContent="☾"}else{document.documentElement.setAttribute("data-theme","dark");localStorage.setItem("theme","dark");$("themeBtn").textContent="☀"}};
</script>
</body>
</html>
